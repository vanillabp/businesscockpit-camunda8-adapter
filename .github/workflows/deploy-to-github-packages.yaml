name: Publish to GitHub Packages
# Only a push to main publishes the snapshot. Other repositories compile against the
# shared snapshot coordinates, so what gets published has to be what main holds, not
# whatever branch was pushed last.
"on":
  push:
    branches:
      - "main"
concurrency:
  # shared with the pull-request build: one build of this repository at a time, queued
  # and never cancelled, because snapshot artifacts share their coordinates and parallel
  # publishes overwrite each other
  group: businesscockpit-camunda8-adapter-build
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Publish package
        run: mvn -s $GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml
          --batch-mode --no-transfer-progress --update-snapshots deploy
        env:
          USER_NAME: "${{ secrets.VANILLABP_USER_NAME }}"
          USER_TOKEN: "${{ secrets.VANILLABP_USER_TOKEN }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Upload the test reports of a failed build
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*application*.log
          retention-days: 7
          if-no-files-found: ignore
