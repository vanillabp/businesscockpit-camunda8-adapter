name: Publish to GitHub Packages
# Only a push to main publishes the snapshot. Other repositories compile against the
# shared snapshot coordinates, so what gets published has to be what main holds, not
# whatever branch was pushed last.
"on":
  push:
    branches:
      - "main"
concurrency:
  # One publish of this repository at a time, because snapshot artifacts share their
  # coordinates and two publishes at once overwrite each other. A run which is already
  # running is never cancelled. A run which is only waiting can be taken out by a newer
  # one, because GitHub keeps at most one waiting run per group, and for a publish of
  # main that is what should happen: the newer run carries the newer artifacts. The
  # pull-request build has a group of its own, one per pull request, because it
  # publishes nothing. The release has a group of its own too, so it can run beside a
  # publish: the 'central-portal' profile switches the deploy plugin off, so a release
  # uploads to Maven Central and nothing of it reaches GitHub Packages.
  group: businesscockpit-camunda8-adapter-publish
  cancel-in-progress: false
permissions:
  contents: read
  # what 'actions/deploy-pages' in the 'deploy-coverage-report' job needs: 'pages: write'
  # to publish the page, and 'id-token: write' for the token it exchanges with the Pages
  # service. That job names no permissions of its own, so it gets these. The 'publish'
  # job does name its own, which replace these for it - it only uploads the reports as an
  # artifact, and that needs neither.
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin
          cache: maven
      - name: Publish package
        # The whole lifecycle up to 'deploy', tests included. The worst run on record
        # took 6.9 minutes and the median 5.4, so 30 minutes is around four times the
        # worst. A publish which hangs also blocks the next one, because this workflow
        # allows one publish at a time.
        timeout-minutes: 30
        run: mvn -s $GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml
          --batch-mode --no-transfer-progress --update-snapshots deploy
        env:
          USER_NAME: "${{ secrets.VANILLABP_USER_NAME }}"
          USER_TOKEN: "${{ secrets.VANILLABP_USER_TOKEN }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      # The reports are already there: the step above runs the whole lifecycle up to
      # 'deploy', and JaCoCo writes both of them in 'verify'. So this step only copies them
      # under the names they get on the web. A name is the last part of the address the
      # badge in README.md reads, and it follows the sibling repositories, which measure
      # each platform on its own and call the two reports 'spring-boot-report' and
      # 'quarkus-report'.
      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          cp -r test-coverage-report/spring-boot/report coverage/spring-boot-report
          cp -r test-coverage-report/quarkus/report coverage/quarkus-report
      - name: Upload coverage report files as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage
      - name: Upload the test reports of a failed build
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*application*.log
          retention-days: 7
          if-no-files-found: ignore
  # A job of its own, because the deployment runs in the environment 'github-pages' and
  # the job which builds the artifact must not. It waits for 'publish' and takes the
  # artifact that job uploaded.
  deploy-coverage-report:
    # This workflow starts on a push to main only, so the condition is true for every run
    # it has today. It is here for the day somebody adds a trigger: a page built from
    # another branch would overwrite the report of main.
    if: "${{ github.ref_name == github.event.repository.default_branch }}"
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
