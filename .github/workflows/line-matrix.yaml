name: Release lines
# Every release line, built and tested against the cluster its own pin names. A pull
# request runs this matrix as well, so a line which breaks is seen while whoever wrote the
# change is still there. It runs here once a night on top of that, which is what answers a
# line broken by something outside the repository, an alpha rewritten under us for example.
"on":
  schedule:
    # Early enough to be green or red before anybody starts working. GitHub queues a
    # scheduled run rather than starting it at the given time, and the wait is hours long:
    # asked for 01:37 UTC, the run of the 16th of September 2026 started at 06:38, which is
    # half past eight in Berlin and right when somebody is pushing to this repository. The
    # matrix of camunda-community-hub/vanillabp-camunda8-adapter answers that the same way,
    # by asking hours before the hour it wants, and its runs start between 04:45 and 05:10
    # UTC. So this one asks the night before. The minute is a crooked one because GitHub's
    # queue is longest on the hour, and it is not the 23rd, so the two repositories do not
    # ask at the same moment.
    - cron: "47 23 * * *"
  workflow_dispatch:
  # Two callers. The pull-request checks run the matrix on every pull request, and the
  # release runs it as its gate, because no GA line of a release may be red. Both read the
  # output below, which leaves the preview line out, and both call without the input below,
  # so the job 'lines-verified' asks the GA lines alone for them. Every line is a GA line
  # since 8.10 went GA on 2026-09-29, so both answers are the same answer today and the
  # difference waits for the first 8.11 pre-release. A red preview line leaves their run
  # green too, and that is the 'continue-on-error' of the matrix job rather than anything a
  # caller does. See decisions 9 and 14 in the repository's DECISIONS.md.
  workflow_call:
    inputs:
      preview-line-counts:
        description: Whether a red preview line makes the job 'lines-verified' red, and
          with it the run of the caller. Off by default, because a defect of the
          pre-release a preview line is built against may cost a night and may not cost
          a pull request or a release. No line is a preview line today, so this input
          changes nothing until the first 8.11 pre-release. See decision 14 in the
          repository's DECISIONS.md.
        type: boolean
        required: false
        default: false
    outputs:
      broken-ga-lines:
        description: The GA lines which did not build, separated by blanks, or 'none'.
          Empty when this matrix did not get far enough to say, which a caller has to
          read as a failure.
        value: "${{ jobs.ga-lines.outputs.broken }}"
# A called workflow may not ask for more than the workflow calling it granted, and the
# pull-request checks grant 'contents: read'. Nothing here needs more: what the build reads from
# GitHub Packages it reads with VANILLABP_USER_TOKEN and not with the workflow's own token.
permissions:
  contents: read
env:
  # The VanillaBP artifacts, the cockpit's extensions-commons and the Camunda 8 adapter are
  # snapshots in GitHub Packages until the release. Reading them needs a token, see
  # github-packages-settings.xml.
  USER_NAME: "${{ secrets.VANILLABP_USER_NAME }}"
  USER_TOKEN: "${{ secrets.VANILLABP_USER_TOKEN }}"
jobs:
  # The live lines are not maintained here: they are the line-* profiles of the POM, which
  # also carry the pins. So the matrix cannot fall behind the build.
  discover:
    runs-on: ubuntu-latest
    outputs:
      lines: "${{ steps.list.outputs.lines }}"
      # Which line is the preview line, and it has to be known BEFORE the matrix starts:
      # the job below is allowed to break for that line alone, and GitHub reads
      # 'continue-on-error' when it creates the job and not when the job ends.
      preview: "${{ steps.list.outputs.preview }}"
    steps:
      - uses: actions/checkout@v7
      # Which line is the preview line is the 'camunda8.line.preview' property of its
      # profile, and bin/line-preview.sh of the Camunda 8 adapter is what reads that
      # property out of a POM. No profile carries it today, so the answer is empty and
      # every line below is a line which may not break. The script is checked out rather
      # than copied: it is tested there, it is what the client API check of this repository
      # already uses, and a second reader of the same property would be a second opinion
      # about it.
      - uses: actions/checkout@v7
        with:
          repository: camunda-community-hub/vanillabp-camunda8-adapter
          ref: main
          path: camunda8-adapter
      - id: list
        name: Collect the release lines
        # Every line the POM defines is built, a preview line included. What one cluster
        # cannot serve is left out a level deeper, by tag, in the profile of that line. Line
        # 8.10 is down to one such tag since it went GA, and its profile says what was
        # measured about it. A whole line left out here would prove nothing at all, and the
        # two things which exist on 8.10 alone, the cancel listener of the process and the
        # job lease, would have no automatic proof anywhere.
        run: |
          set -euo pipefail
          list=$(sed -n 's|.*<id>line-\([0-9][^<]*\)</id>.*|\1|p' pom.xml \
            | jq -R -s -c 'split("\n")[:-1]')
          echo "lines=${list}" >> "$GITHUB_OUTPUT"
          echo "Building lines: ${list}"
          # Asked here and nowhere else, so no two jobs can answer it differently: the
          # matrix below reads this to know which line may break, and the job 'ga-lines'
          # reads it to know which lines a caller waits for.
          preview=""
          for line in $(echo "${list}" | jq -r '.[]'); do
            answer="$(camunda8-adapter/bin/line-preview.sh "$line" pom.xml)"
            [ "${answer}" != "true" ] || preview="${line}"
          done
          echo "preview=${preview}" >> "$GITHUB_OUTPUT"
          echo "Preview line: ${preview:-none}"

  # One build per line, against the cluster that line pins, with its own version string.
  line:
    needs: discover
    runs-on: ubuntu-latest
    # The preview line may break without colouring the run, and no other line may. A failed
    # job of a called workflow fails the job of the caller, and a failed job makes the whole
    # run red, so a broken preview line made every pull request red while its gate was
    # green. With this the preview line hands a success to everything which reads a job
    # result, and the run stays green. Stephan decided that on the 1st of October 2026. See
    # decision 14 in the repository's DECISIONS.md.
    #
    # No profile carries 'camunda8.line.preview' today, so 'discover' hands out an empty
    # answer and this reads false for every line. The expression stays, because the line of
    # the first 8.11 pre-release needs it again and nothing else here has to change for it.
    #
    # The night therefore does NOT learn of a broken preview line from the job result any
    # more. It reads 'broken-all' of the job 'ga-lines', which is built from the file each
    # line writes about itself, and that file still says 'failure': 'continue-on-error'
    # changes the result the job hands out, it does not change 'job.status' inside the job.
    # So do not turn 'lines-verified' back to 'needs.line.result'. That reads 'success' now
    # whatever the preview line did, and the night would stop seeing the break.
    continue-on-error: "${{ matrix.line == needs.discover.outputs.preview }}"
    strategy:
      fail-fast: false
      matrix:
        line: "${{ fromJSON(needs.discover.outputs.lines) }}"
    steps:
      - uses: actions/checkout@v7
      # This repository compiles against the core of the VanillaBP Camunda 8 adapter and
      # gets the Camunda client through it, and its integration tests start the cluster
      # that adapter's test-support names. So a line here is only real if the adapter
      # underneath it is the same line. The adapter publishes one snapshot, built against
      # the current GA client, so the other lines have to be built here. It is a compile,
      # not a test run: what the adapter does is proven by the adapter's own matrix.
      - uses: actions/checkout@v7
        with:
          repository: camunda-community-hub/vanillabp-camunda8-adapter
          ref: main
          path: camunda8-adapter
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin
          cache: maven
      - name: "Build the Camunda 8 adapter of line ${{ matrix.line }}"
        # The step this limit was written for. On the 20th of September 2026 it hung for
        # 35 minutes on line 8.8 without printing a line and the run had to be stopped by
        # hand, while the run before it had done the same work in under two minutes.
        # Nothing in this repository touches how a line is built, so it was the runner or
        # GitHub Packages. Over the runs still on record this compile takes 2.2 minutes at
        # its worst and 1.6 at its median. So 20 minutes is around nine times the worst,
        # and a compile which hangs still ends the same night. Without a limit the step
        # inherits the six hours GitHub gives a job by default.
        timeout-minutes: 20
        # Only the modules this repository consumes, plus what they need: the adapter's
        # integration tests, its smoke test and its native-image tests are none of our
        # business. The revision names the line, so the local repository holds one
        # artifact per line and nothing can quietly fall back to the published snapshot
        # of the current GA line.
        #
        # 'maven.test.skip' and not 'skipTests': Failsafe 3.6.0 reads '-DskipITs' and no
        # longer reads '-DskipTests', and the adapter pins that version as this repository
        # does. So under plain '-DskipTests' its integration tests still run, and the run
        # measured three quarters of an hour of them against a cluster we did not want to
        # start here. 'maven.test.skip' skips the test compilation as well, which is what
        # makes this a compile.
        run: mvn -f camunda8-adapter/pom.xml
          -s "$GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml"
          --batch-mode --no-transfer-progress --update-snapshots
          -Pline-${{ matrix.line }} -Drevision=2.0.0-${{ matrix.line }}-SNAPSHOT
          -Dmaven.test.skip=true
          -pl core,spring-boot,quarkus/runtime,quarkus/deployment,test-support -am
          clean install
      - name: "Build and test line ${{ matrix.line }}"
        # The long step of this workflow: the integration tests start a cluster. The
        # worst run on record took 42 minutes. That one was a failing 8.10 line whose
        # tests sat out their own waits, and the worst green run took 12. So 90 minutes
        # is more than twice the worst. It is here for a run which stops moving, not to
        # make a slow runner red.
        timeout-minutes: 90
        # 'clean', because classes compiled against another client are binary compatible
        # with nothing, and the revision is the version string this line would publish,
        # so the build proves the coordinates as well as the code. The adapter version is
        # the one built above. 'install' without 'verify': install runs every phase verify
        # has, and naming both compiled each module twice for nothing.
        run: mvn -s "$GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml"
          --batch-mode --no-transfer-progress --update-snapshots
          -Pline-${{ matrix.line }} -Drevision=0.9.0-${{ matrix.line }}-SNAPSHOT
          "-Dcamunda8-adapter.version.line-${{ matrix.line }}=2.0.0-${{ matrix.line }}-SNAPSHOT"
          clean install
      # A nightly line going red otherwise leaves nothing behind, so whoever reads the
      # matrix in the morning sees which test failed and never why. The reports hold what
      # the test asserted, and the logs hold what the application and the cluster did while
      # it waited, which is the half a timeout never tells on its own.
      - name: Upload the test reports of a failed line
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # one name per line: a matrix uploading twice under one name conflicts
          name: test-reports-${{ matrix.line }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*application*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: The cluster and the client this line was tested against
        # the cluster is the adapter's word, not ours: its test-support carries the image
        # and the secondary storage of its line, and the tests here start what it names.
        #
        # Which is why this step ends by holding that image against the pin of this
        # repository. A pin here that stayed behind the adapter's breaks nothing and is
        # therefore invisible: the tests run an older client against a newer cluster, the
        # literals that cluster gained arrive as UNKNOWN_ENUM_VALUE, and the line looks as
        # green as the day before while it proves less than the README says it does. It
        # stayed unseen on two lines at once, which is why the step does not stop at the
        # 'cat' it used to be. See decision 10 in the repository's DECISIONS.md.
        if: always()
        run: |
          set -euo pipefail
          properties=camunda8-adapter/test-support/target/classes/camunda8-cluster.properties
          cat "$properties"
          cat camunda8-adapter/core/target/classes/META-INF/vanillabp/adapter-camunda8.properties
          image="$(sed -n 's|^cluster\.image=||p' "$properties")"
          pinned="$(sed -n 's|.*<camunda8\.version\.line-${{ matrix.line }}>\([^<]*\)</.*|\1|p' pom.xml)"
          # the tag rather than the whole name, so a renamed image is still compared
          if [ "${image##*:}" != "${pinned}" ]; then
            echo "Line ${{ matrix.line }} ran ${image} against the client ${pinned}." >&2
            echo "The cluster follows the pin of camunda-community-hub/vanillabp-camunda8-adapter, so" >&2
            echo "raise camunda8.version.line-${{ matrix.line }} in pom.xml to what that image names." >&2
            exit 1
          fi
      # What this line did, written down for the job 'ga-lines' below. A matrix cannot hand
      # one result per line to another job: every job of it writes the same output and the
      # last one to finish overwrites the rest. So each line leaves a file named after
      # itself. The same shape as in camunda-community-hub/vanillabp-camunda8-adapter.
      #
      # This file is also the only place which tells the truth about a preview line. Such a
      # line runs with 'continue-on-error', so the result it hands to another job is a
      # success even when it broke, while 'job.status' read here inside the job is 'failure'.
      # Everything which has to see the break reads these files.
      - name: What this line did
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/line-result"
          echo "${{ job.status }}" > "${RUNNER_TEMP}/line-result/${{ matrix.line }}"
      - name: Hand that to the job which sorts the lines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: line-result-${{ matrix.line }}
          path: "${{ runner.temp }}/line-result/${{ matrix.line }}"

  # One name that never changes while the matrix grows and shrinks with the lines. The night
  # is who reads it, and there it means every line of the matrix, a preview line included.
  #
  # A caller does not read it: build.yaml requires 'line-pins-verified' and the release
  # requires 'ga-lines-verified', and both of those read the GA lines alone. But a red job of
  # a called workflow colours the whole run of its caller, so this job made every pull
  # request red while the gate of that pull request was green. That is what the input is for.
  # A caller leaves it at 'false' and this job then asks the GA lines only; the night has no
  # input at all and asks every line. A defect of a pre-release may cost a night, it may not
  # cost a pull request or a release. While no line is a preview line, which is the case
  # since 8.10 went GA, both questions have the same answer. See decision 14 in the
  # repository's DECISIONS.md.
  #
  # Both answers come from the job 'ga-lines' below, which reads the file every line wrote
  # about itself. Neither reads a job result: the preview line runs with
  # 'continue-on-error', so its result is a success even when it broke, and the night would
  # see nothing. The file it wrote is what still says 'failure'.
  #
  # A red night is answered by release-lines-issue.yaml, which opens an issue for the line
  # that broke. It is a workflow of its own and not a step here, and that file says why.
  lines-verified:
    if: always()
    needs: ga-lines
    runs-on: ubuntu-latest
    steps:
      - name: Every line built
        env:
          # The night and a dispatch ARE this workflow, they do not call it, so there is no
          # input and this is empty. Empty therefore has to mean that the preview line
          # counts, and only the word 'false' from a caller turns it off.
          COUNT_PREVIEW: "${{ inputs.preview-line-counts }}"
          BROKEN_ALL: "${{ needs.ga-lines.outputs.broken-all }}"
          BROKEN: "${{ needs.ga-lines.outputs.broken }}"
        run: |
          set -euo pipefail
          if [ "${COUNT_PREVIEW}" != "false" ]; then
            broken="${BROKEN_ALL}"
            echo "every line counts here, and these did not build:" \
              "${broken:-nothing was said}"
          else
            broken="${BROKEN}"
            echo "GA lines only, and these did not build: ${broken:-nothing was said}"
          fi
          case "${broken}" in
            none)
              echo "Every line this run waits for built." ;;
            "")
              echo "The job 'ga-lines' said nothing, so this run cannot tell which line" >&2
              echo "broke. Read the jobs above." >&2
              exit 1 ;;
            *)
              echo "These lines did not build: ${broken}" >&2
              exit 1 ;;
          esac

  # The same matrix, read without the preview line, for the callers which need that answer.
  # Both of them do: a preview line is built against a pre-release which is rewritten under
  # us, and a defect of that may cost a night, it may not cost a pull request or a release.
  # Such a line still builds here, its job is there to read, and a red one still gets its
  # issue in the night. There is none today, so 'broken' and 'broken-all' hold the same
  # lines. That is decision 14 in the repository's DECISIONS.md, and 'lines-verified' above
  # is the name the night reads. Both answers are read here, out of the files the lines
  # wrote, and the job above reads them from this one.
  #
  # Which line is the preview line is not asked here: the job 'discover' asks it, because
  # the matrix needs that answer before it starts.
  #
  # This job reports what it found, it does not fail on it. A failed job hands no output to
  # the caller, so failing here would leave the caller with an empty answer instead of the
  # names of the broken lines.
  ga-lines:
    if: always()
    needs: [discover, line]
    runs-on: ubuntu-latest
    outputs:
      broken: "${{ steps.read.outputs.broken }}"
      # Every line which did not build, a preview line included. This is what the night
      # reads, and it exists because the job result of a preview line is a success even
      # when that line broke.
      broken-all: "${{ steps.read.outputs.broken-all }}"
    # Nothing is read from the working tree here, so this job checks nothing out. The lines
    # arrive as artifacts, and which of them is the preview line arrives from 'discover'.
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: line-result-*
          merge-multiple: true
          path: line-results
      - id: read
        name: Which lines did not build, and which of them a caller waits for
        env:
          LINES: "${{ needs.discover.outputs.lines }}"
          PREVIEW: "${{ needs.discover.outputs.preview }}"
        run: |
          set -euo pipefail
          broken=""
          broken_all=""
          counted=0
          for line in $(echo "${LINES:-[]}" | jq -r '.[]'); do
            counted=$((counted + 1))
            # a line whose job was cancelled before it could write anything counts as a line
            # which did not build
            result=nothing
            [ ! -f "line-results/${line}" ] || result="$(cat "line-results/${line}")"
            preview=false
            [ "${line}" != "${PREVIEW}" ] || preview=true
            echo "line ${line}: ${result}, preview line: ${preview}"
            [ "$result" != "success" ] || continue
            broken_all="${broken_all}${broken_all:+ }${line}"
            [ "$preview" != "true" ] || continue
            broken="${broken}${broken:+ }${line}"
          done
          if [ "$counted" -eq 0 ]; then
            echo "No line was collected, so this run says nothing about any line." >&2
            exit 1
          fi
          echo "broken=${broken:-none}" >> "$GITHUB_OUTPUT"
          echo "broken-all=${broken_all:-none}" >> "$GITHUB_OUTPUT"
