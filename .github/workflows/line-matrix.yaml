name: Release lines
# Every release line, built and tested against the cluster its own pin names. A pull
# request builds the current GA line alone, because the Camunda 8 integration tests are
# the slowest thing in this repository and a story would otherwise pay for every line.
# What a story does not prove is proven here, once a night.
"on":
  schedule:
    # Early enough to be green or red before anybody starts working. GitHub queues a
    # scheduled run rather than starting it at the given time, and the wait is hours long:
    # asked for 01:37 UTC, the run of the 16th of September 2026 started at 06:38, which is
    # half past eight in Berlin and right when somebody is pushing to this repository. The
    # matrix of vanillabp/camunda8-adapter answers that the same way, by asking hours before
    # the hour it wants, and its runs start between 04:45 and 05:10 UTC. So this one asks
    # the night before. The minute is a crooked one because GitHub's queue is longest on the
    # hour, and it is not the 23rd, so the two repositories do not ask at the same moment.
    - cron: "47 23 * * *"
  workflow_dispatch:
  # Two callers. The pull-request checks run the matrix when a pin moves, and the release
  # runs it as its gate, because no GA line of a release may be red. Both read the output
  # below, which leaves the preview line out. See decisions 9 and 14 in the repository's
  # DECISIONS.md.
  workflow_call:
    outputs:
      broken-ga-lines:
        description: The GA lines which did not build, separated by blanks, or 'none'.
          Empty when this matrix did not get far enough to say, which a caller has to
          read as a failure.
        value: "${{ jobs.ga-lines.outputs.broken }}"
# A called workflow may not ask for more than the workflow calling it granted, and the
# pull-request checks grant 'contents: read'. Nothing here needs more: what the build reads from
# GitHub Packages it reads with VANILLABP_USER_TOKEN and not with the workflow's own token.
permissions:
  contents: read
env:
  # The VanillaBP artifacts, the cockpit's extensions-commons and the Camunda 8 adapter are
  # snapshots in GitHub Packages until the release. Reading them needs a token, see
  # github-packages-settings.xml.
  USER_NAME: "${{ secrets.VANILLABP_USER_NAME }}"
  USER_TOKEN: "${{ secrets.VANILLABP_USER_TOKEN }}"
jobs:
  # The live lines are not maintained here: they are the line-* profiles of the POM, which
  # also carry the pins. So the matrix cannot fall behind the build.
  discover:
    runs-on: ubuntu-latest
    outputs:
      lines: "${{ steps.list.outputs.lines }}"
    steps:
      - uses: actions/checkout@v7
      - id: list
        name: Collect the release lines
        # Every line the POM defines is built, the preview line included. What one cluster
        # cannot serve is left out a level deeper, by tag: the 'line-8.10' profile of the POM
        # excludes the tests which need a user task that alpha never finishes creating, and it
        # says there what that costs and when it goes away. A whole line left out here would
        # prove nothing at all, and the two things which exist on 8.10 alone, the cancel
        # listener of the process and the job lease, would have no automatic proof anywhere.
        run: |
          list=$(sed -n 's|.*<id>line-\([0-9][^<]*\)</id>.*|\1|p' pom.xml \
            | jq -R -s -c 'split("\n")[:-1]')
          echo "lines=${list}" >> "$GITHUB_OUTPUT"
          echo "Building lines: ${list}"

  # One build per line, against the cluster that line pins, with its own version string.
  line:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        line: "${{ fromJSON(needs.discover.outputs.lines) }}"
    steps:
      - uses: actions/checkout@v7
      # This repository compiles against the core of the VanillaBP Camunda 8 adapter and
      # gets the Camunda client through it, and its integration tests start the cluster
      # that adapter's test-support names. So a line here is only real if the adapter
      # underneath it is the same line. The adapter publishes one snapshot, built against
      # the current GA client, so the other lines have to be built here. It is a compile,
      # not a test run: what the adapter does is proven by the adapter's own matrix.
      - uses: actions/checkout@v7
        with:
          repository: vanillabp/camunda8-adapter
          ref: main
          path: camunda8-adapter
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin
          cache: maven
      - name: "Build the Camunda 8 adapter of line ${{ matrix.line }}"
        # The step this limit was written for. On the 20th of September 2026 it hung for
        # 35 minutes on line 8.8 without printing a line and the run had to be stopped by
        # hand, while the run before it had done the same work in under two minutes.
        # Nothing in this repository touches how a line is built, so it was the runner or
        # GitHub Packages. Over the runs still on record this compile takes 2.2 minutes at
        # its worst and 1.6 at its median. So 20 minutes is around nine times the worst,
        # and a compile which hangs still ends the same night. Without a limit the step
        # inherits the six hours GitHub gives a job by default.
        timeout-minutes: 20
        # Only the modules this repository consumes, plus what they need: the adapter's
        # integration tests, its smoke test and its native-image tests are none of our
        # business. The revision names the line, so the local repository holds one
        # artifact per line and nothing can quietly fall back to the published snapshot
        # of the current GA line.
        #
        # 'maven.test.skip' and not 'skipTests': Failsafe 3.6.0 reads '-DskipITs' and no
        # longer reads '-DskipTests', and the adapter pins that version as this repository
        # does. So under plain '-DskipTests' its integration tests still run, and the run
        # measured three quarters of an hour of them against a cluster we did not want to
        # start here. 'maven.test.skip' skips the test compilation as well, which is what
        # makes this a compile.
        run: mvn -f camunda8-adapter/pom.xml
          -s "$GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml"
          --batch-mode --no-transfer-progress --update-snapshots
          -Pline-${{ matrix.line }} -Drevision=2.0.0-${{ matrix.line }}-SNAPSHOT
          -Dmaven.test.skip=true
          -pl core,spring-boot,quarkus/runtime,quarkus/deployment,test-support -am
          clean install
      - name: "Build and test line ${{ matrix.line }}"
        # The long step of this workflow: the integration tests start a cluster. The
        # worst run on record took 42 minutes. That one was a failing 8.10 line whose
        # tests sat out their own waits, and the worst green run took 12. So 90 minutes
        # is more than twice the worst. It is here for a run which stops moving, not to
        # make a slow runner red.
        timeout-minutes: 90
        # 'clean', because classes compiled against another client are binary compatible
        # with nothing, and the revision is the version string this line would publish,
        # so the build proves the coordinates as well as the code. The adapter version is
        # the one built above. 'install' without 'verify': install runs every phase verify
        # has, and naming both compiled each module twice for nothing.
        run: mvn -s "$GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml"
          --batch-mode --no-transfer-progress --update-snapshots
          -Pline-${{ matrix.line }} -Drevision=0.9.0-${{ matrix.line }}-SNAPSHOT
          "-Dcamunda8-adapter.version.line-${{ matrix.line }}=2.0.0-${{ matrix.line }}-SNAPSHOT"
          clean install
      # A nightly line going red otherwise leaves nothing behind, so whoever reads the
      # matrix in the morning sees which test failed and never why. The reports hold what
      # the test asserted, and the logs hold what the application and the cluster did while
      # it waited, which is the half a timeout never tells on its own.
      - name: Upload the test reports of a failed line
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # one name per line: a matrix uploading twice under one name conflicts
          name: test-reports-${{ matrix.line }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*application*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: The cluster and the client this line was tested against
        # the cluster is the adapter's word, not ours: its test-support carries the image
        # and the secondary storage of its line, and the tests here start what it names.
        #
        # Which is why this step ends by holding that image against the pin of this
        # repository. A pin here that stayed behind the adapter's breaks nothing and is
        # therefore invisible: the tests run an older client against a newer cluster, the
        # literals that cluster gained arrive as UNKNOWN_ENUM_VALUE, and the line looks as
        # green as the day before while it proves less than the README says it does. It
        # stayed unseen on two lines at once, which is why the step does not stop at the
        # 'cat' it used to be. See decision 10 in the repository's DECISIONS.md.
        if: always()
        run: |
          set -euo pipefail
          properties=camunda8-adapter/test-support/target/classes/camunda8-cluster.properties
          cat "$properties"
          cat camunda8-adapter/core/target/classes/META-INF/vanillabp/adapter-camunda8.properties
          image="$(sed -n 's|^cluster\.image=||p' "$properties")"
          pinned="$(sed -n 's|.*<camunda8\.version\.line-${{ matrix.line }}>\([^<]*\)</.*|\1|p' pom.xml)"
          # the tag rather than the whole name, so a renamed image is still compared
          if [ "${image##*:}" != "${pinned}" ]; then
            echo "Line ${{ matrix.line }} ran ${image} against the client ${pinned}." >&2
            echo "The cluster follows the pin of vanillabp/camunda8-adapter, so raise" >&2
            echo "camunda8.version.line-${{ matrix.line }} in pom.xml to what that image names." >&2
            exit 1
          fi
      # What this line did, written down for the job 'ga-lines' below. A matrix cannot hand
      # one result per line to another job: every job of it writes the same output and the
      # last one to finish overwrites the rest. So each line leaves a file named after
      # itself. The same shape as in vanillabp/camunda8-adapter.
      - name: What this line did
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/line-result"
          echo "${{ job.status }}" > "${RUNNER_TEMP}/line-result/${{ matrix.line }}"
      - name: Hand that to the job which sorts the lines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: line-result-${{ matrix.line }}
          path: "${{ runner.temp }}/line-result/${{ matrix.line }}"

  # One name that never changes, so branch protection, the pull-request checks and the
  # release gate have something to require while the matrix grows and shrinks with the
  # lines.
  #
  # A red night is answered by release-lines-issue.yaml, which opens an issue for the line
  # that broke. It is a workflow of its own and not a step here, and that file says why.
  lines-verified:
    if: always()
    needs: line
    runs-on: ubuntu-latest
    steps:
      - name: Every line built
        run: |
          echo "lines: ${{ needs.line.result }}"
          [ "${{ needs.line.result }}" = "success" ]

  # The same matrix, read without the preview line, for the callers which need that answer.
  # Both of them do: the preview line is built against an alpha which is rewritten under us,
  # and a defect of that alpha may cost a night, it may not cost a pull request or a release.
  # The preview line still builds here, its job is there to read, and a red one still gets its
  # issue in the night. That is decision 14 in the repository's DECISIONS.md, and
  # 'lines-verified' above is the name the night reads.
  #
  # This job reports what it found, it does not fail on it. A failed job hands no output to
  # the caller, so failing here would leave the caller with an empty answer instead of the
  # names of the broken lines.
  ga-lines:
    if: always()
    needs: [discover, line]
    runs-on: ubuntu-latest
    outputs:
      broken: "${{ steps.read.outputs.broken }}"
    steps:
      - uses: actions/checkout@v7
      # Which line is the preview line is the 'camunda8.line.preview' property of its profile,
      # and bin/line-preview.sh of the Camunda 8 adapter is what reads that property out of a
      # POM. It is checked out rather than copied: the script is tested there, it is what the
      # client API check of this repository already uses, and a second reader of the same
      # property would be a second opinion about it.
      - uses: actions/checkout@v7
        with:
          repository: vanillabp/camunda8-adapter
          ref: main
          path: camunda8-adapter
      - uses: actions/download-artifact@v8
        with:
          pattern: line-result-*
          merge-multiple: true
          path: line-results
      - id: read
        name: Which lines did not build, and which of them a caller waits for
        env:
          LINES: "${{ needs.discover.outputs.lines }}"
        run: |
          set -euo pipefail
          broken=""
          counted=0
          for line in $(echo "${LINES:-[]}" | jq -r '.[]'); do
            counted=$((counted + 1))
            # a line whose job was cancelled before it could write anything counts as a line
            # which did not build
            result=nothing
            [ ! -f "line-results/${line}" ] || result="$(cat "line-results/${line}")"
            preview="$(camunda8-adapter/bin/line-preview.sh "$line" pom.xml)"
            echo "line ${line}: ${result}, preview line: ${preview}"
            [ "$result" != "success" ] || continue
            [ "$preview" != "true" ] || continue
            broken="${broken}${broken:+ }${line}"
          done
          if [ "$counted" -eq 0 ]; then
            echo "No line was collected, so this run says nothing about any line." >&2
            exit 1
          fi
          echo "broken=${broken:-none}" >> "$GITHUB_OUTPUT"
