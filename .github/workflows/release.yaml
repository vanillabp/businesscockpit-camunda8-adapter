name: Release
# Publishes to Maven Central through the release parent's 'release' and 'central-portal'
# profiles, once per live release line and all from the SAME commit, so a fix exists on
# every line the moment it is committed. The version is not written into the POM: it is
# '${revision}', supplied per line as '<version>-<line>'. See README.md, section
# "Release lines".
"on":
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to release, without the line suffix (e.g. 0.9.0)"
        required: true
concurrency:
  # One release of this repository at a time. Two releases at once would deploy the same
  # coordinates to Maven Central and write the same tag. The lines of one release are a
  # matrix inside the run, held in order by 'max-parallel: 1', so this group is about two
  # runs. GitHub keeps at most one waiting run per group, so a third dispatch while one
  # release runs and one waits ends the waiting one as 'cancelled' without ever starting a
  # job. A release is dispatched by hand, so somebody is there to see that and dispatch
  # again. 'cancel-in-progress: false' protects the run which is already running and
  # nothing else, which is what a release needs: a run cut in half leaves some lines on
  # Central and the rest nowhere.
  #
  # The publish keeps its own group, so a release and a publish run beside each other.
  # They cannot write the same thing. The 'central-portal' profile switches the deploy
  # plugin off and uploads through the Central publishing plugin instead, and the only
  # distribution management in the POM is the snapshot repository, which a released
  # version never uses. So nothing of a release reaches GitHub Packages, and the publish
  # of main is what puts the snapshot there.
  group: businesscockpit-camunda8-adapter-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # No release while a GA line is red. A line which is not GA yet is not asked: 8.10 is an
  # alpha, it is published as a preview, and nothing claims it was proven. The matrix builds
  # it like every other line and hands out the GA lines separately, so which lines this gate
  # waits for is the matrix's own word and not a second list kept here. See decision 14 in
  # the repository's DECISIONS.md.
  #
  # The gate is the nightly matrix itself, called here, and not a look at what the matrix
  # said last night. Reading last night's result would be cheaper, and it would prove less
  # than it looks. This repository compiles against SNAPSHOTs of the VanillaBP Camunda 8
  # adapter and of the cockpit's extensions-commons, and every build resolves them with
  # --update-snapshots at the moment it runs. So a green run of last night says that the
  # code of that commit worked with the artifacts of that night, and the release publishes
  # today's. The commit is the smaller half of the question. Running the matrix inside the
  # release builds the commit which is released against the artifacts it is released
  # against, and it needs no rule about what "the same commit" means after a merge.
  #
  # It costs the release about forty minutes. A release is dispatched by hand and happens a
  # few times a year, so that is cheap, and there is no way past it: a line published with a
  # defect which was already known cannot be taken back off Maven Central.
  #
  # See decision 9 in the repository's DECISIONS.md.
  lines:
    uses: ./.github/workflows/line-matrix.yaml
    secrets: inherit

  # The gate itself. It runs whatever the matrix did, because a red preview line fails the
  # matrix as a whole and this job still has to read which lines were red. The answer is the
  # 'broken-ga-lines' output, and an empty one means the matrix never got far enough to say.
  ga-lines-verified:
    if: always()
    needs: lines
    runs-on: ubuntu-latest
    steps:
      - name: Every GA line is green
        env:
          BROKEN: "${{ needs.lines.outputs.broken-ga-lines }}"
        run: |
          echo "lines: ${{ needs.lines.result }}"
          case "$BROKEN" in
            none)
              echo "Every GA line built and tested green, so this release may go out." ;;
            "")
              echo "The matrix did not get far enough to say which lines built, so nothing" >&2
              echo "here says this release is safe. Read the jobs of the matrix above." >&2
              exit 1 ;;
            *)
              echo "These GA lines did not build: ${BROKEN}" >&2
              echo "A release publishes to Maven Central and cannot be taken back, so it" >&2
              echo "waits until they are green." >&2
              exit 1 ;;
          esac

  # The live lines are not maintained here: they are the line-* profiles of the POM, which
  # also carry the pins. So the release cannot fall behind the build.
  #
  # Every line is released, the preview line included. Only the gate above leaves the
  # preview out, because nothing has proven it and nothing claims it is proven: its version
  # says alpha.
  discover:
    needs: ga-lines-verified
    runs-on: ubuntu-latest
    outputs:
      lines: "${{ steps.list.outputs.lines }}"
    steps:
      - uses: actions/checkout@v7
      - id: list
        name: Collect the release lines
        run: |
          list=$(sed -n 's|.*<id>line-\([0-9][^<]*\)</id>.*|\1|p' pom.xml \
            | jq -R -s -c 'split("\n")[:-1]')
          echo "lines=${list}" >> "$GITHUB_OUTPUT"
          echo "Releasing lines: ${list}"

  line:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # one line at a time: they publish under one release parent and a half-published
      # matrix is harder to read than a stopped one
      max-parallel: 1
      fail-fast: true
      matrix:
        line: "${{ fromJSON(needs.discover.outputs.lines) }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin
          cache: maven
          server-id: vanillabp-central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: "${{ secrets.MAVEN_GPG_PRIVATE_KEY }}"
          gpg-passphrase: GPG_PASSPHRASE
      # 'clean', because classes compiled against one Camunda client are binary compatible
      # with no other one, so a stale target/ from the previous line fails at runtime
      # rather than at compile time
      - name: "Release line ${{ matrix.line }}"
        run: mvn -s $GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml
          --batch-mode --no-transfer-progress -Dgpg.passphrase=$GPG_PASSPHRASE
          -Pline-${{ matrix.line }},release,central-portal
          -Drevision=${{ github.event.inputs.release_version }}-${{ matrix.line }}
          clean deploy
        env:
          GPG_PASSPHRASE: "${{ secrets.MAVEN_GPG_PASSPHRASE }}"
          MAVEN_USERNAME: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_USER }}"
          MAVEN_PASSWORD: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_PW }}"
          USER_NAME: "${{ secrets.VANILLABP_USER_NAME }}"
          USER_TOKEN: "${{ secrets.VANILLABP_USER_TOKEN }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  tag:
    needs: line
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag the commit every line was built from
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "${{ github.event.inputs.release_version }}" \
            -m "Release ${{ github.event.inputs.release_version }}, all lines"
          git push origin "${{ github.event.inputs.release_version }}"
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ github.event.inputs.release_version }}"
          name: "v${{ github.event.inputs.release_version }}"
          generate_release_notes: true
          draft: true
