# The Camunda client each line was last READ against. Nothing builds with these numbers.
#
# A line takes its client from the Camunda 8 adapter (decision 32), so a client change reaches
# this repository without a commit here. Camunda adds enum literals and interface methods
# inside a line and does not call that breaking, and our code can break on it just as the
# adapter's can. Every morning .github/workflows/client-api-changes.yaml holds these numbers
# against the adapter's pins. When one differs, it opens a pull request which raises it and
# says what the new client added. Merging that pull request is what "read" means. See
# decision 33.
#
# One entry per line this repository builds. A line joins and leaves here with its profile.
line-8.8=8.8.41
line-8.9=8.9.23
line-8.10=8.10.2
